<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빗속의 반딧불이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;

  --ink-deep:#060A18;
  --ink:#16203F;
  --ink-soft:#243258;
  --rain:#9EC4E4;
  --glow:#FFC24D;
  --glow-hot:#FFF3CF;
  --paper:#EDE4D2;
  --paper-dim:#9AA3B4;
  --moss:#6FB187;
  --fog:#C3D0DD;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--ink-deep);
  color:var(--paper);
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}

#stage{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:none}
#stage.is-idle{cursor:default}
#scene{display:block;width:100%;height:100%}

/* ── HUD ─────────────────────────────── */
.hud{position:absolute;inset:0;pointer-events:none;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;opacity:0;transition:opacity .35s ease}
.hud.on{opacity:1}
.score{font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:clamp(2rem,7vw,3.1rem);line-height:1;color:var(--glow-hot);text-shadow:0 0 24px rgba(255,194,77,.45)}
.best{font-size:.82rem;color:var(--paper-dim);text-align:right;line-height:1.5}
.best b{display:block;font-weight:400;font-size:1.05rem;color:var(--paper)}

.chips{position:absolute;left:20px;bottom:18px;display:flex;gap:8px;pointer-events:none}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;font-size:.8rem;background:rgba(9,14,32,.62);border:1px solid rgba(158,196,228,.22)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.leaf{color:var(--moss)}
.chip.fog{color:var(--fog)}
.chip.star{color:var(--glow)}
.chip span{color:var(--paper)}

/* ── Overlay ─────────────────────────── */
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 38%,rgba(6,10,24,.72) 0%,rgba(6,10,24,.93) 70%);
  transition:opacity .3s ease}
.veil[hidden]{display:none}
.panel{width:min(30rem,100%);text-align:center}

h1{font-family:'Gowun Batang','Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(2.1rem,9vw,3.4rem);margin:0 0 .5rem;letter-spacing:.02em;
  color:var(--paper);text-shadow:0 0 40px rgba(255,194,77,.22)}
h1 + p{margin:0 auto 1.9rem;max-width:22rem;color:var(--paper-dim);line-height:1.7;font-size:1rem}

.legend{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1rem;
  width:fit-content;margin:0 auto 2rem;text-align:left;font-size:.92rem}
.legend dt{display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.legend dt::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.legend dd{margin:0;color:var(--paper-dim)}
.legend .l-leaf{color:var(--moss)}
.legend .l-fog{color:var(--fog)}
.legend .l-star{color:var(--glow)}

button{font:inherit;font-size:1.05rem;color:var(--ink-deep);background:var(--glow);
  border:0;border-radius:999px;padding:.85rem 2.6rem;cursor:pointer;
  box-shadow:0 0 0 0 rgba(255,194,77,.5);transition:box-shadow .2s ease,transform .1s ease}
button:hover{box-shadow:0 0 34px 0 rgba(255,194,77,.4)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--glow-hot);outline-offset:4px}

.hint{margin:1.1rem 0 0;font-size:.82rem;color:#6E7793}

/* 결과 화면 */
.verdict{font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:clamp(1.5rem,6vw,2rem);margin:0 0 1.8rem;color:var(--paper)}
.result{display:flex;justify-content:center;gap:clamp(1.6rem,7vw,3.2rem);margin-bottom:2rem}
.result div{min-width:4.5rem}
.result dt{font-size:.8rem;color:var(--paper-dim);margin-bottom:.35rem}
.result dd{margin:0;font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:clamp(1.6rem,6.5vw,2.2rem);line-height:1}
.result .big dd{color:var(--glow-hot)}
.record{display:inline-block;margin:0 0 1.5rem;padding:.35rem 1rem;border-radius:999px;
  font-size:.85rem;color:var(--glow);border:1px solid rgba(255,194,77,.45);background:rgba(255,194,77,.08)}
.record[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="stage" class="is-idle">
  <canvas id="scene"></canvas>

  <div class="hud" id="hud">
    <div class="score" id="score">0</div>
    <div class="best">최고 기록<b id="bestTop">0</b></div>
  </div>

  <div class="chips" id="chips"></div>

  <!-- 시작 화면 -->
  <div class="veil" id="startVeil">
    <div class="panel">
      <h1>빗속의 반딧불이</h1>
      <p id="howto">빗방울을 피해 오래 버티세요. 시간이 갈수록 비가 거세집니다.</p>
      <dl class="legend">
        <dt class="l-leaf">나뭇잎</dt><dd>잠시 비를 맞지 않습니다</dd>
        <dt class="l-fog">안개</dt><dd>빗방울이 느려집니다</dd>
        <dt class="l-star">별빛</dt><dd>점수가 두 배로 오릅니다</dd>
      </dl>
      <button id="startBtn">시작하기</button>
      <p class="hint" id="startHint"></p>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="veil" id="overVeil" hidden>
    <div class="panel">
      <p class="verdict" id="verdict">빗방울에 맞았습니다</p>
      <span class="record" id="recordBadge" hidden>최고 기록을 넘었습니다</span>
      <dl class="result">
        <div class="big"><dt>점수</dt><dd id="finalScore">0</dd></div>
        <div><dt>버틴 시간</dt><dd id="finalTime">0초</dd></div>
        <div><dt>최고</dt><dd id="finalBest">0</dd></div>
      </dl>
      <button id="againBtn">다시 하기</button>
      <p class="hint" id="againHint"></p>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var stage   = document.getElementById('stage');
var cv      = document.getElementById('scene');
var ctx     = cv.getContext('2d');
var hud     = document.getElementById('hud');
var chipBox = document.getElementById('chips');
var scoreEl = document.getElementById('score');
var bestTop = document.getElementById('bestTop');
var startVeil = document.getElementById('startVeil');
var overVeil  = document.getElementById('overVeil');

var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var touchLike = window.matchMedia('(hover: none)').matches;

document.getElementById('startHint').textContent =
  touchLike ? '화면 아무 곳이나 손가락으로 쓸어서 움직입니다' : '마우스를 좌우로 움직이거나 방향키를 씁니다';
document.getElementById('againHint').textContent =
  touchLike ? '화면을 두드려도 다시 시작합니다' : '스페이스바로도 다시 시작합니다';

/* ── 최고 기록 ─────────────────────── */
var BEST_KEY = 'firefly-rain-best';
var best = 0;
try { var raw = localStorage.getItem(BEST_KEY); if (raw) best = parseInt(raw, 10) || 0; } catch (e) {}
function saveBest(v){ try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }
var fmt = function(n){ return Math.floor(n).toLocaleString('ko-KR'); };
bestTop.textContent = fmt(best);

/* ── 화면 크기 ─────────────────────── */
var W = 0, H = 0, DPR = 1, groundY = 0;
function resize(){
  var r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - Math.max(46, Math.min(86, H * 0.11));
  player.y = groundY - 30;
  player.x = Math.min(Math.max(player.x, 24), W - 24);
  player.tx = player.x;
}
window.addEventListener('resize', resize);

/* ── 상태 ──────────────────────────── */
var MODE_READY = 0, MODE_PLAY = 1, MODE_OVER = 2;
var mode = MODE_READY;

var player = { x: 200, tx: 200, y: 200, r: 10, trail: [] };
var drops = [], items = [], splashes = [], sparks = [];
var eff = { shield: 0, slow: 0, double: 0 };
var elapsed = 0, score = 0;
var spawnAcc = 0, itemAt = 0;
var wind = 0, windTarget = 0, windAt = 0;
var shake = 0, flash = 0, overAt = 0;
var keyL = false, keyR = false;

function reset(){
  drops.length = 0; items.length = 0; splashes.length = 0; sparks.length = 0;
  player.trail.length = 0;
  eff.shield = eff.slow = eff.double = 0;
  elapsed = 0; score = 0; spawnAcc = 0; itemAt = 7;
  wind = windTarget = 0; windAt = 18;
  shake = 0; flash = 0;
  player.x = player.tx = W / 2;
}

/* ── 입력 ──────────────────────────── */
function aimAt(clientX){
  var r = stage.getBoundingClientRect();
  player.tx = Math.min(Math.max(clientX - r.left, player.r + 2), W - player.r - 2);
}
stage.addEventListener('pointermove', function(e){ if (mode === MODE_PLAY) aimAt(e.clientX); });
stage.addEventListener('pointerdown', function(e){
  if (mode === MODE_PLAY) aimAt(e.clientX);
  else if (mode === MODE_OVER && performance.now() - overAt > 600) start();
});
window.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft')  keyL = true;
  if (e.key === 'ArrowRight') keyR = true;
  if (e.key === ' ' || e.key === 'Enter'){
    if (mode !== MODE_PLAY) { e.preventDefault(); start(); }
  }
});
window.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft')  keyL = false;
  if (e.key === 'ArrowRight') keyR = false;
});
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);

function start(){
  reset();
  mode = MODE_PLAY;
  startVeil.hidden = true; overVeil.hidden = true;
  hud.classList.add('on');
  stage.classList.remove('is-idle');
  scoreEl.textContent = '0';
}

function gameOver(){
  mode = MODE_OVER;
  overAt = performance.now();
  flash = 1; shake = reduceMotion ? 0 : 16;
  for (var i = 0; i < 22; i++){
    var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 190;
    sparks.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 40, life: .7, max: .7, c: '255,194,77' });
  }
  var isRecord = score > best;
  if (isRecord) { best = Math.floor(score); saveBest(best); }
  setTimeout(function(){
    if (mode !== MODE_OVER) return;
    document.getElementById('finalScore').textContent = fmt(score);
    document.getElementById('finalTime').textContent = elapsed.toFixed(1) + '초';
    document.getElementById('finalBest').textContent = fmt(best);
    document.getElementById('recordBadge').hidden = !isRecord;
    document.getElementById('verdict').textContent = isRecord ? '가장 오래 버텼습니다' : '빗방울에 맞았습니다';
    bestTop.textContent = fmt(best);
    overVeil.hidden = false;
    hud.classList.remove('on');
    chipBox.innerHTML = '';
    stage.classList.add('is-idle');
  }, 620);
}

/* ── 생성 ──────────────────────────── */
function spawnDrop(ambient){
  var ramp = Math.min(elapsed / 70, 1);
  var speed = (ambient ? 150 : 250 + 380 * ramp) * (0.85 + Math.random() * 0.4);
  var heavy = !ambient && elapsed > 22 && Math.random() < 0.12;
  drops.push({
    x: Math.random() * (W + 120) - 60,
    y: -30,
    vx: wind * speed,
    vy: speed * (heavy ? 1.25 : 1),
    len: heavy ? 26 : 13 + Math.random() * 11,
    w: heavy ? 4.2 : 2.1 + Math.random() * 0.9,
    a: ambient ? 0.3 : 0.55 + Math.random() * 0.4,
    ghost: !!ambient
  });
}
function spawnItem(){
  var kinds = ['leaf', 'fog', 'star'];
  items.push({
    x: 40 + Math.random() * (W - 80),
    y: -40,
    vy: 105,
    r: 16,
    kind: kinds[(Math.random() * 3) | 0],
    ph: Math.random() * 6.28
  });
}

/* ── 충돌 ──────────────────────────── */
function segDist(px, py, ax, ay, bx, by){
  var dx = bx - ax, dy = by - ay;
  var L = dx * dx + dy * dy;
  var t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var cx = ax + dx * t - px, cy = ay + dy * t - py;
  return Math.sqrt(cx * cx + cy * cy);
}

/* ── 업데이트 ──────────────────────── */
function update(dt){
  var playing = mode === MODE_PLAY;

  if (playing){
    elapsed += dt;
    score += dt * 100 * (eff.double > 0 ? 2 : 1);

    if (keyL) player.tx -= 620 * dt;
    if (keyR) player.tx += 620 * dt;
    player.tx = Math.min(Math.max(player.tx, player.r + 2), W - player.r - 2);

    if (elapsed > windAt){
      windTarget = (Math.random() * 0.7 - 0.35);
      windAt = elapsed + 6 + Math.random() * 5;
    }
    wind += (windTarget - wind) * Math.min(1, dt * 0.8);

    spawnAcc += dt;
    var ramp = Math.min(elapsed / 70, 1);
    var gap = 0.34 - 0.255 * ramp;
    while (spawnAcc > gap){ spawnAcc -= gap; spawnDrop(false); }

    if (elapsed > itemAt){ spawnItem(); itemAt = elapsed + 9 + Math.random() * 5; }

    eff.shield = Math.max(0, eff.shield - dt);
    eff.slow   = Math.max(0, eff.slow   - dt);
    eff.double = Math.max(0, eff.double - dt);
  } else if (mode === MODE_READY){
    spawnAcc += dt;
    while (spawnAcc > 0.12){ spawnAcc -= 0.12; spawnDrop(true); }
  }

  // 반딧불이
  player.x += (player.tx - player.x) * Math.min(1, dt * 15);
  if (mode !== MODE_OVER){
    player.trail.unshift({ x: player.x, y: player.y });
    if (player.trail.length > (reduceMotion ? 4 : 11)) player.trail.pop();
  }

  // 빗방울
  var slowK = eff.slow > 0 ? 0.42 : 1;
  for (var i = drops.length - 1; i >= 0; i--){
    var d = drops[i];
    if (mode !== MODE_OVER){
      d.y += d.vy * slowK * dt;
      d.x += d.vx * slowK * dt;
    }
    if (d.y - d.len > groundY + 8 || d.x < -140 || d.x > W + 140){
      if (d.y > groundY && d.x > 0 && d.x < W && splashes.length < 44)
        splashes.push({ x: d.x, y: groundY + 2 + Math.random() * 6, life: .34, max: .34 });
      drops.splice(i, 1);
      continue;
    }
    if (playing && !d.ghost && Math.abs(d.y - player.y) < d.len + 40){
      var tx2 = d.x - (d.vx / d.vy) * d.len, ty2 = d.y - d.len;
      if (segDist(player.x, player.y, d.x, d.y, tx2, ty2) < player.r + d.w * 0.5 + 1){
        if (eff.shield > 0){
          for (var s = 0; s < 6; s++){
            var aa = Math.random() * Math.PI * 2;
            sparks.push({ x: d.x, y: d.y, vx: Math.cos(aa)*90, vy: Math.sin(aa)*90, life: .3, max: .3, c: '111,177,135' });
          }
          drops.splice(i, 1);
        } else {
          gameOver();
        }
      }
    }
  }

  // 아이템
  for (var j = items.length - 1; j >= 0; j--){
    var it = items[j];
    if (mode !== MODE_OVER) it.y += it.vy * dt;
    if (it.y > H + 50){ items.splice(j, 1); continue; }
    if (playing){
      var ddx = it.x - player.x, ddy = it.y - player.y;
      if (Math.sqrt(ddx*ddx + ddy*ddy) < it.r + player.r + 4){
        if (it.kind === 'leaf') eff.shield = 4.5;
        if (it.kind === 'fog')  eff.slow   = 4.5;
        if (it.kind === 'star') eff.double = 6;
        var col = it.kind === 'leaf' ? '111,177,135' : (it.kind === 'fog' ? '195,208,221' : '255,194,77');
        for (var k = 0; k < 14; k++){
          var ab = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 140;
          sparks.push({ x: it.x, y: it.y, vx: Math.cos(ab)*sp, vy: Math.sin(ab)*sp, life: .55, max: .55, c: col });
        }
        items.splice(j, 1);
      }
    }
  }

  for (var p = splashes.length - 1; p >= 0; p--){
    splashes[p].life -= dt; if (splashes[p].life <= 0) splashes.splice(p, 1);
  }
  for (var q = sparks.length - 1; q >= 0; q--){
    var sk = sparks[q];
    sk.x += sk.vx * dt; sk.y += sk.vy * dt; sk.vy += 340 * dt;
    sk.life -= dt; if (sk.life <= 0) sparks.splice(q, 1);
  }

  shake = Math.max(0, shake - dt * 46);
  flash = Math.max(0, flash - dt * 3.2);
}

/* ── 그리기 ────────────────────────── */
function drawBackground(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060A18');
  g.addColorStop(0.55, '#111A36');
  g.addColorStop(1, '#1B2748');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 달무리
  var mx = W * 0.8, my = H * 0.16;
  var mg = ctx.createRadialGradient(mx, my, 0, mx, my, Math.max(W, H) * 0.34);
  mg.addColorStop(0, 'rgba(198,216,236,.16)');
  mg.addColorStop(1, 'rgba(198,216,236,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(226,235,246,.42)';
  ctx.beginPath(); ctx.arc(mx, my, 17, 0, 6.2832); ctx.fill();
}

function drawGround(){
  ctx.fillStyle = '#080C1C';
  ctx.beginPath();
  ctx.moveTo(0, groundY + 6);
  ctx.quadraticCurveTo(W * 0.5, groundY - 8, W, groundY + 4);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgba(111,177,135,.34)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (var i = 0; i < 26; i++){
    var gx = ((i * 137.5) % (W + 60)) - 30;
    var gh = 12 + ((i * 53) % 22);
    ctx.beginPath();
    ctx.moveTo(gx, groundY + 8);
    ctx.quadraticCurveTo(gx + (i % 2 ? 7 : -7), groundY + 8 - gh * 0.6, gx + (i % 2 ? 12 : -12), groundY + 8 - gh);
    ctx.stroke();
  }
}

function drawDrops(){
  ctx.lineCap = 'round';
  for (var i = 0; i < drops.length; i++){
    var d = drops[i];
    var tx2 = d.x - (d.vx / d.vy) * d.len, ty2 = d.y - d.len;
    ctx.strokeStyle = 'rgba(158,196,228,' + (d.a * (eff.slow > 0 ? .7 : 1)).toFixed(3) + ')';
    ctx.lineWidth = d.w;
    ctx.beginPath(); ctx.moveTo(tx2, ty2); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
}

function drawSplashes(){
  ctx.strokeStyle = 'rgba(158,196,228,.5)'; ctx.lineWidth = 1.4;
  for (var i = 0; i < splashes.length; i++){
    var s = splashes[i], k = s.life / s.max;
    ctx.globalAlpha = k * 0.7;
    ctx.beginPath(); ctx.arc(s.x, s.y, (1 - k) * 11 + 2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawItem(it, t){
  var bob = Math.sin(t * 2.2 + it.ph) * 4;
  ctx.save();
  ctx.translate(it.x, it.y + bob);

  if (it.kind === 'leaf'){
    ctx.rotate(Math.sin(t * 1.4 + it.ph) * 0.35);
    ctx.fillStyle = 'rgba(111,177,135,.92)';
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.quadraticCurveTo(15, -2, 0, 15); ctx.quadraticCurveTo(-15, -2, 0, -15);
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,10,24,.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 13); ctx.stroke();
  } else if (it.kind === 'fog'){
    ctx.fillStyle = 'rgba(195,208,221,.75)';
    ctx.beginPath();
    ctx.arc(-8, 2, 9, 0, 6.2832); ctx.arc(3, -3, 11, 0, 6.2832); ctx.arc(11, 4, 8, 0, 6.2832);
    ctx.fill();
  } else {
    ctx.rotate(t * 0.9);
    var gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);
    gg.addColorStop(0, 'rgba(255,243,207,.55)'); gg.addColorStop(1, 'rgba(255,194,77,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#FFF3CF';
    ctx.beginPath();
    for (var i = 0; i < 8; i++){
      var ang = (Math.PI / 4) * i, rad = i % 2 ? 5.5 : 15;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(ang) * rad, Math.sin(ang) * rad);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(t){
  // 꼬리
  for (var i = player.trail.length - 1; i > 0; i--){
    var p = player.trail[i], k = 1 - i / player.trail.length;
    ctx.fillStyle = 'rgba(255,194,77,' + (k * 0.16).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, player.r * k * 0.85, 0, 6.2832); ctx.fill();
  }

  var pulse = 1 + Math.sin(t * 5) * 0.06;
  var R = player.r * 3.6 * pulse * (eff.double > 0 ? 1.35 : 1);
  var hg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, R);
  hg.addColorStop(0, 'rgba(255,214,120,.55)');
  hg.addColorStop(0.45, 'rgba(255,194,77,.18)');
  hg.addColorStop(1, 'rgba(255,194,77,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(player.x, player.y, R, 0, 6.2832); ctx.fill();

  ctx.fillStyle = '#FFF3CF';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r * pulse, 0, 6.2832); ctx.fill();

  if (eff.shield > 0){
    var fade = eff.shield < 1 ? (Math.sin(eff.shield * 22) * 0.5 + 0.5) : 1;
    ctx.strokeStyle = 'rgba(111,177,135,' + (0.45 + fade * 0.4).toFixed(3) + ')';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 11, t * 2, t * 2 + 4.6);
    ctx.stroke();
  }
  if (eff.double > 0){
    ctx.fillStyle = 'rgba(255,243,207,.85)';
    for (var s = 0; s < 3; s++){
      var a2 = t * 3 + s * 2.1;
      ctx.beginPath();
      ctx.arc(player.x + Math.cos(a2) * 20, player.y + Math.sin(a2 * 1.3) * 16, 1.9, 0, 6.2832);
      ctx.fill();
    }
  }
}

function drawSparks(){
  for (var i = 0; i < sparks.length; i++){
    var s = sparks[i];
    ctx.fillStyle = 'rgba(' + s.c + ',' + (s.life / s.max).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.4 * (s.life / s.max) + 0.6, 0, 6.2832); ctx.fill();
  }
}

function render(t){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  drawDrops();
  drawGround();
  drawSplashes();
  for (var i = 0; i < items.length; i++) drawItem(items[i], t);
  if (mode !== MODE_OVER || flash > 0.2) drawPlayer(t);
  drawSparks();

  if (eff.slow > 0){
    var k = Math.min(1, eff.slow);
    ctx.fillStyle = 'rgba(195,208,221,' + (0.1 * k).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,243,207,' + (flash * 0.42).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ── 상태 표시 ─────────────────────── */
var lastChips = '';
function syncChips(){
  var on = [];
  if (eff.shield > 0) on.push(['leaf', '나뭇잎', eff.shield]);
  if (eff.slow   > 0) on.push(['fog',  '안개',   eff.slow]);
  if (eff.double > 0) on.push(['star', '별빛',   eff.double]);
  var key = on.map(function(o){ return o[0] + Math.ceil(o[2]); }).join('|');
  if (key === lastChips) return;
  lastChips = key;
  chipBox.innerHTML = on.map(function(o){
    return '<span class="chip ' + o[0] + '"><i></i><span>' + o[1] + ' ' + Math.ceil(o[2]) + '</span></span>';
  }).join('');
}

/* ── 루프 ──────────────────────────── */
var prev = performance.now(), acc = 0;
function frame(now){
  var dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  update(dt);
  render(now / 1000);
  if (mode === MODE_PLAY){
    acc += dt;
    if (acc > 0.06){ acc = 0; scoreEl.textContent = fmt(score); syncChips(); }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) prev = performance.now();
});

resize();
player.x = player.tx = W / 2;
requestAnimationFrame(frame);
})();
</script>
